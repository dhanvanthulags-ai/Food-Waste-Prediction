<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Waste Prediction System</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            background:#E8F5E9;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:950px;
            background:#ffffff;
            display:flex;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0px 8px 25px rgba(0,0,0,0.2);
        }

        .left{
            width:65%;
            padding:35px;
        }

        .right{
            width:35%;
            background:#2E7D32;
            color:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        h1{
            color:#2E7D32;
            margin-bottom:25px;
            text-align:center;
        }

        label{
            display:block;
            margin-top:12px;
            margin-bottom:5px;
            font-weight:600;
        }

        input,select{
            width:100%;
            padding:11px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }

        input:focus,
        select:focus{
            border:2px solid #2E7D32;
            outline:none;
        }

        button{
            width:100%;
            padding:13px;
            margin-top:25px;
            background:#2E7D32;
            color:white;
            border:none;
            border-radius:8px;
            font-size:17px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#1B5E20;
        }

        .result-title{
            font-size:24px;
            margin-bottom:20px;
        }

        .prediction{
            font-size:42px;
            font-weight:bold;
        }

        .note{
            margin-top:20px;
            text-align:center;
            line-height:1.6;
            opacity:0.9;
        }

    </style>

</head>

<body>

<div class="container">

<div class="left">

<h1>Food Waste Prediction System</h1>

<form action="/predict" method="POST">

<label>Day</label>
<select name="day">
<option>MONDAY</option>
<option>TUESDAY</option>
<option>WEDNESDAY</option>
<option>THURSDAY</option>
<option>FRIDAY</option>
<option>SATURDAY</option>
<option>SUNDAY</option>
</select>

<label>Meal</label>
<select name="meal">
<option>BREAKFAST</option>
<option>LUNCH</option>
<option>DINNER</option>
</select>

<label>Menu</label>
<select name="menu">
<option>IDLI</option>
<option>DOSA</option>
<option>PONGAL</option>
<option>POORI</option>
<option>SAMBAR RICE</option>
<option>TOMATO RICE</option>
<option>LEMON RICE</option>
<option>BIRYANI</option>
<option>CURD RICE</option>
<option>CHAPATI</option>
<option>PAROTTA</option>
<option>UPMA</option>
<option>KICHADI</option>
</select>

<label>Students Present</label>
<input type="number" name="students" required>

<label>Weather</label>
<select name="weather">
<option>SUNNY</option>
<option>CLOUDY</option>
<option>RAINY</option>
</select>

<label>Special Event</label>
<select name="special_event">
<option>YES</option>
<option>NO</option>
</select>

<label>Exam</label>
<select name="exam">
<option>YES</option>
<option>NO</option>
</select>

<label>Food Prepared (KG)</label>
<input type="number" name="food_prepared" required>

<button type="submit">
Predict Food Waste
</button>

</form>

</div>

<div class="right">

<div class="result-title">
Prediction Result
</div>

{% if prediction %}

<div class="prediction">
{{ prediction }} kg
</div>

{% else %}

<div class="prediction">
--
</div>

{% endif %}

<div class="note">
Enter the required details and click the Predict button to estimate the expected food waste.
</div>

</div>

</div>

</body>
</html>
